[package]
name = "sumie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
macos-ci = ["sumie-macos/macos-ci"]

[workspace]
members = [
    "crates/sumie-config",
    "crates/sumie-core",
    "crates/sumie-font",
    "crates/sumie-locale",
    "crates/sumie-macos",
    "crates/sumie-pty",
    "crates/sumie-render",
    "crates/sumie-ui",
    "crates/sumie-vt",
    "crates/sumie-wayland",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fontconfig = { version = "0.11.0", features = ["dlopen"] }
harfrust = "0.16.1"
nix = { version = "0.31.3", default-features = false, features = ["event"] }
png = "0.18.1"
pollster = "1.0.3"
pty-process = { version = "0.5.4", default-features = false }
raw-window-handle = "0.6.2"
rustix = { version = "1.1.6", features = ["event", "fs", "pipe", "process", "termios"] }
# preserve_order keeps schema properties in declaration order for the settings editor.
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
sumie-macos = { path = "crates/sumie-macos" }
sumie-wayland = { path = "crates/sumie-wayland" }
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# Format-preserving edits for settings write-back; same parser crates as toml.
toml_edit = { version = "0.25.20", default-features = false, features = ["display", "parse"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
wayland-backend = { version = "0.3.17", features = ["rwh_06"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl"] }
zeno = "0.3.3"

[dependencies]
sumie-config = { path = "crates/sumie-config" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
png.workspace = true
pollster.workspace = true
rustix = { workspace = true, features = ["time"] }
sumie-core = { path = "crates/sumie-core" }
sumie-font = { path = "crates/sumie-font" }
sumie-locale = { path = "crates/sumie-locale" }
sumie-pty = { path = "crates/sumie-pty" }
sumie-render = { path = "crates/sumie-render" }
sumie-ui = { path = "crates/sumie-ui" }
sumie-vt = { path = "crates/sumie-vt" }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
calloop = "0.14.5"
nix = { workspace = true, features = ["dir", "process"] }
xkeysym = "0.2.1"
sumie-wayland.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs", "hostname", "user"] }
sumie-macos.workspace = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

# Reviewed forks; third_party/README.md lists each patch and how to regenerate it.
# The wgpu-hal fork resolves its path siblings from the same checkout; pinning them to that
# rev keeps one copy of each. Their sources equal the crates.io 30.0.2 releases.
[patch.crates-io]
naga = { git = "https://github.com/Zakkaus/wgpu", rev = "391fb61f4c0bec28c8c2a368a5a90f525c2fd1eb" }
naga-types = { git = "https://github.com/Zakkaus/wgpu", rev = "391fb61f4c0bec28c8c2a368a5a90f525c2fd1eb" }
wgpu-hal = { git = "https://github.com/Zakkaus/wgpu", rev = "391fb61f4c0bec28c8c2a368a5a90f525c2fd1eb" }
wgpu-naga-bridge = { git = "https://github.com/Zakkaus/wgpu", rev = "391fb61f4c0bec28c8c2a368a5a90f525c2fd1eb" }
wgpu-types = { git = "https://github.com/Zakkaus/wgpu", rev = "391fb61f4c0bec28c8c2a368a5a90f525c2fd1eb" }
winit = { git = "https://github.com/Zakkaus/winit", rev = "660fb5737becf01c7095ef2d3b932bcc8bd277cf" }
