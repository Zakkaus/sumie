[package]
name = "sumie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[workspace]
members = [
    "crates/sumie-config",
    "crates/sumie-core",
    "crates/sumie-font",
    "crates/sumie-macos",
    "crates/sumie-pty",
    "crates/sumie-render",
    "crates/sumie-ui",
    "crates/sumie-vt",
    "crates/sumie-wayland",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
fontconfig = { version = "0.11.0", features = ["dlopen"] }
harfrust = "0.16.1"
png = "0.18.1"
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
zeno = "0.3.3"
sumie-macos = { path = "crates/sumie-macos" }
sumie-wayland = { path = "crates/sumie-wayland" }

[target.'cfg(target_os = "linux")'.dependencies]
sumie-wayland.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sumie-macos.workspace = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
