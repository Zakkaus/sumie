name: M1b-0 native probes

on:
  push:
    branches: [spike/m1b0]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: metal, sample: 1}
    name: ${{ matrix.scenario }}-${{ matrix.sample }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record VM identity
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            uname -m
            sw_vers
            printf 'ImageOS=%s\nImageVersion=%s\ncommit=%s\n' "$ImageOS" "$ImageVersion" "$GITHUB_SHA"
            uptime
          } | tee "$RUNNER_TEMP/evidence/host.txt"
          test "$(uname -m)" = arm64
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "SUMIE_SPIKE_EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Exercise native scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: bash "scripts/macos-spike/$SCENARIO.sh" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: m1b0-${{ matrix.scenario }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
