name: Release

# A `v*` tag builds the release archives and opens a draft GitHub release for review.
# A manual run builds the same archives and keeps them as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the archive names; the commit hash is used when empty
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux
            zig-sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
            zig-sha256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
          - runner: macos-26
            target: aarch64-macos
            zig-sha256: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The runner context is not available in job-level env, so export these here.
      - name: Point the build caches at the runner temp directory
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sumie-target" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
      - name: Resolve the version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=${REF_NAME#v}
          else
            version=${INPUT_VERSION:-0.0.0-${COMMIT:0:7}}
          fi
          case $version in
            '' | *[!0-9A-Za-z.+-]*) echo "unusable version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install stable --profile minimal
      - name: Check the tag against the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$crate" != "$VERSION" ]; then
            echo "tag $VERSION does not match the workspace version $crate" >&2
            exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      # ziglang.org sometimes serves a runner at a few KiB/s; keep the checked archive.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zig-archive
          key: zig-${{ matrix.target }}-${{ matrix.zig-sha256 }}
      - name: Install Zig 0.17.1
        shell: bash
        env:
          ZIG_PLATFORM: ${{ matrix.target }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          name="zig-$ZIG_PLATFORM-0.17.1"
          mkdir -p "$RUNNER_TEMP/zig-archive"
          archive="$RUNNER_TEMP/zig-archive/$name.tar.xz"
          # Mirrors from ziglang.org/download/community-mirrors.txt; the checksum below
          # trusts none of them. A transfer under 100 KB/s for 30 s moves to the next.
          for base in https://pkg.hexops.org/zig https://zig.linus.dev/zig \
            https://ziglang.org/download/0.17.1; do
            test -s "$archive" && break
            curl -fsSL --retry 2 --speed-limit 100000 --speed-time 30 \
              "$base/$name.tar.xz" -o "$archive" || rm -f "$archive"
          done
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # libghostty-vt's Zig build takes most of a cold run; reuse it and Cargo's output.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/zig-cache
            ${{ runner.temp }}/sumie-target
          key: release-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'crates/sumie-vt/build.rs') }}
          restore-keys: release-${{ matrix.runner }}-
      - if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Binary reads its configuration without a window
        run: '"$CARGO_TARGET_DIR/release/sumie" config show --defaults > /dev/null'

      - name: Package the Linux tarball
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          scripts/linux/package.sh "$CARGO_TARGET_DIR/release/sumie" "$RUNNER_TEMP/dist" \
            "$VERSION" "${TARGET%-linux}"
          tar -tzf "$RUNNER_TEMP"/dist/*.tar.gz
      # rsvg-convert renders the icon master; scripts/macos/bundle.sh fails without it.
      - name: Bundle sumie.app and create the disk image
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUMIE_REQUIRE_ICON: '1'
        run: |
          brew install librsvg
          dmg=$(scripts/macos/bundle.sh --dmg "$CARGO_TARGET_DIR/release/sumie" \
            "$RUNNER_TEMP/stage" "$VERSION")
          mkdir -p "$RUNNER_TEMP/dist"
          mv "$dmg" "$RUNNER_TEMP/dist/"
          codesign --display --verbose=2 "$RUNNER_TEMP/stage/sumie.app"
          ls -l "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.dmg > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create the draft release
        run: |
          prerelease=
          case $TAG in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --draft --verify-tag $prerelease \
            --title "$TAG" --notes-file docs/release-notes.md --generate-notes
