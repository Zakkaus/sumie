name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            zig-platform: x86_64-linux
            zig-sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          - runner: ubuntu-24.04-arm
            zig-platform: aarch64-linux
            zig-sha256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
          - runner: macos-15
            zig-platform: aarch64-macos
            zig-sha256: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Install Zig 0.17.1
        shell: bash
        env:
          ZIG_PLATFORM: ${{ matrix.zig-platform }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          name="zig-$ZIG_PLATFORM-0.17.1"
          archive="$RUNNER_TEMP/$name.tar.xz"
          curl -fsSL "https://ziglang.org/download/0.17.1/$name.tar.xz" -o "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: scripts/check-all.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sumie-target
