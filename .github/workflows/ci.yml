name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            zig-platform: x86_64-linux
            zig-sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          - runner: ubuntu-24.04-arm
            zig-platform: aarch64-linux
            zig-sha256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
          - runner: macos-26
            zig-platform: aarch64-macos
            zig-sha256: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Install Linux build dependencies and Mesa software GPU drivers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev fonts-noto-color-emoji
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          lavapipe=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe"
          {
            echo "VK_DRIVER_FILES=$lavapipe"
            echo 'EGL_PLATFORM=surfaceless'
            echo 'LIBGL_ALWAYS_SOFTWARE=1'
            echo 'MESA_GL_VERSION_OVERRIDE=3.0'
            echo 'MESA_GLES_VERSION_OVERRIDE=3.0'
            echo 'SUMIE_REQUIRE_GPU=1'
          } >> "$GITHUB_ENV"
      # ziglang.org sometimes serves a runner at a few KiB/s; keep the checked archive.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zig-archive
          key: zig-${{ matrix.zig-platform }}-${{ matrix.zig-sha256 }}
      - name: Install Zig 0.17.1
        shell: bash
        env:
          ZIG_PLATFORM: ${{ matrix.zig-platform }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          name="zig-$ZIG_PLATFORM-0.17.1"
          mkdir -p "$RUNNER_TEMP/zig-archive"
          archive="$RUNNER_TEMP/zig-archive/$name.tar.xz"
          # Mirrors from ziglang.org/download/community-mirrors.txt; the checksum below
          # trusts none of them. A transfer under 100 KB/s for 30 s moves to the next.
          for base in https://pkg.hexops.org/zig https://zig.linus.dev/zig \
            https://ziglang.org/download/0.17.1; do
            test -s "$archive" && break
            curl -fsSL --retry 2 --speed-limit 100000 --speed-time 30 \
              "$base/$name.tar.xz" -o "$archive" || rm -f "$archive"
          done
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # libghostty-vt's Zig build takes most of a cold run; reuse it and Cargo's output.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/zig-cache
            ${{ runner.temp }}/sumie-target
          key: build-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'crates/sumie-vt/build.rs') }}
          restore-keys: build-${{ matrix.runner }}-
      # Hosted timing is noisy: the frame-slot gates record pings and acquire times here and
      # enforce them on the owner's Mac.
      - if: runner.os == 'macOS'
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
          echo 'SUMIE_REQUIRE_GPU=1' >> "$GITHUB_ENV"
          echo 'SUMIE_TIMING=record' >> "$GITHUB_ENV"
          # Hosted runners have no Pinyin input source; macos-ime runs its protocol cases only.
          echo 'SUMIE_IME_NATIVE=skip' >> "$GITHUB_ENV"
          # Nor Accessibility, which macos-routes needs to press the close button, menu and Dock.
          echo 'SUMIE_QUIT_ROUTES=skip' >> "$GITHUB_ENV"
      - run: scripts/check-all.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sumie-target
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
      # The gate builds the debug profile; code behind cfg(debug_assertions) can break release.
      - name: Clippy the release profile
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sumie-target
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
      # check-all.sh lints the debug profile with macos-ci as the clippy-macos-ci gate.
      - name: Clippy and build the release profile with the macOS runner driver
        if: runner.os == 'macOS'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sumie-target
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
        run: |
          cargo clippy --locked --release --workspace --all-targets --features macos-ci -- -D warnings
          cargo build --release --locked --features macos-ci
      # The build can relink libghostty-vt, so only the run itself is bounded.
      - name: Build the debug binary for the screenshot run
        if: runner.os == 'macOS'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sumie-target
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
        run: cargo build --locked --bin sumie
      - name: Open the terminal, present three frames and capture the third
        if: runner.os == 'macOS'
        timeout-minutes: 3
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sumie-target
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
        run: |
          cargo run --locked --bin sumie -- --exit-after-frames 3 --screenshot frame.png
          test -s frame.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: macos-screenshot
          path: frame.png
          if-no-files-found: error

  # Native Quit through the pinned winit fork: nine cases, then the three controls.
  macos-quit:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record VM identity
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            uname -m
            sw_vers
            printf 'ImageOS=%s\nImageVersion=%s\ncommit=%s\n' "$ImageOS" "$ImageVersion" "$GITHUB_SHA"
            uptime
          } | tee "$RUNNER_TEMP/evidence/host.txt"
          test "$(uname -m)" = arm64
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "SUMIE_SPIKE_EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal
      - run: python3 scripts/check-gate.py macos-quit
      - if: ${{ !cancelled() }}
        run: python3 scripts/negative-controls.py macos-quit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-quit
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
