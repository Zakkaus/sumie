[package]
name = "sumie-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
macos-ci = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-core-graphics", "dep:objc2-foundation"]

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
objc2 = { version = "0.6.5", optional = true, default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
objc2-core-graphics = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "libc"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSString"] }

[lints]
workspace = true
