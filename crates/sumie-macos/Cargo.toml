[package]
name = "sumie-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
macos-ci = [
    "dep:objc2-core-graphics",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/objc2-core-graphics",
    "objc2-app-kit/NSGraphicsContext",
    "objc2-app-kit/NSResponder",
    "objc2-app-kit/NSView",
    "objc2-app-kit/NSWindow",
    "objc2-foundation/NSAppleEventDescriptor",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSDate",
    "objc2-foundation/NSError",
    "objc2-foundation/NSObjCRuntime",
    "objc2-foundation/NSRunLoop",
    "objc2-foundation/libc",
    "objc2-foundation/objc2-core-services",
]

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSTextInputContext"] }
objc2-core-graphics = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue"] }
signal-hook = { version = "0.4.6", default-features = false }
sumie-core = { path = "../sumie-core" }
tracing.workspace = true
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[lints]
workspace = true
