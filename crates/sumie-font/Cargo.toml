[package]
name = "sumie-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harfrust.workspace = true
skrifa.workspace = true
thiserror.workspace = true
zeno.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig.workspace = true
cairo-rs = { version = "0.22.11", default-features = false, features = ["freetype", "v1_18"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCharacterSet", "CFSet", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics"] }

[dev-dependencies]
png.workspace = true

[lints]
workspace = true
