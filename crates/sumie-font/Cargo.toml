[package]
name = "sumie-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harfrust.workspace = true
png.workspace = true
skrifa.workspace = true
thiserror.workspace = true
zeno.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCharacterSet", "CFSet", "CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["CTFont", "CTFontDescriptor", "CTFontTraits"] }

[lints]
workspace = true
