[package]
name = "sumie-quit-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
exclude = ["vendor/winit-0.30.13"]

[dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "libc", "objc2-core-services", "NSAppleEventDescriptor", "NSArray", "NSDate", "NSError", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[patch.crates-io]
winit = { path = "vendor/winit-0.30.13" }
